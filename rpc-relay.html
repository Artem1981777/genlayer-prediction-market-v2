<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>RPC QUIC relay</title></head>
<body>
<pre id="out">RPC relay running — keep this tab open.</pre>
<script>
const OUT = document.getElementById("out");
const LINES = [];
let done = 0, failed = 0;
function log(s){ LINES.push(s); if (LINES.length > 30) LINES.shift(); OUT.textContent = LINES.join("\n"); }
async function loop(){
  for(;;){
    let job = null;
    try {
      const r = await fetch("/next", { cache: "no-store" });
      job = await r.json();
    } catch(e) { log("poll fail: " + e.message); await new Promise(r=>setTimeout(r,2000)); continue; }
    if (!job || !job.id) { await new Promise(r=>setTimeout(r,400)); continue; }
    // Send the RPC request over QUIC (HTTP/3), which the TCP DPI cannot touch.
    let payload = { id: job.id, ok: false, status: 0, text: "" };
    for (let a = 1; a <= 6; a++) {
      try {
        const r = await fetch("https://rpc-bradbury.genlayer.com/", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: job.body,
        });
        const t = await r.text();
        payload = { id: job.id, ok: true, status: r.status, text: t };
        break;
      } catch (e) {
        log("job " + job.id + " attempt " + a + " failed: " + e.message);
        await new Promise(r=>setTimeout(r,1500));
      }
    }
    if (payload.ok) done++; else failed++;
    log("job " + job.id + " -> " + (payload.ok ? "OK " + payload.status + " (" + payload.text.length + "B)" : "FAILED") +
        "  [total ok:" + done + " fail:" + failed + "]");
    try { await fetch("/result", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload) }); }
    catch(e) { log("result post fail: " + e.message); }
  }
}
loop();
</script>
</body>
</html>
